name: Release

on:
  push:
    tags:
      - 'v*'

# Avoid two release runs on the same tag (force-pushed tags etc.).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # for gh release create
  packages: write   # for GHCR push

jobs:
  validate:
    name: validate (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [server, web, docs]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/${{ matrix.app }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - if: matrix.app == 'server'
        run: npx prisma generate

      - run: pnpm validate

      - if: matrix.app == 'server'
        run: pnpm test

      - run: pnpm build

  docker:
    name: Build and push Docker image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve image name
        id: image
        env:
          # Override via the repo's Variables setting if you want a different
          # registry (e.g. "stlalpha/palmr" for Docker Hub). Defaults to GHCR.
          OVERRIDE: ${{ vars.RELEASE_REGISTRY }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            echo "name=$OVERRIDE" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(steps.image.outputs.name, 'ghcr.io/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ !startsWith(steps.image.outputs.name, 'ghcr.io/') }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          # Cache the multi-stage build between runs to keep release builds
          # under ~10 minutes after the first one.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Need full history for `gh release create --generate-notes` to
          # compute the diff against the previous tag.
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
